services:
  # Single Unified Web Service running React SPA + Spring Boot 3 on Docker
  - type: web
    name: expense-tracker-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://expense-tracker-app.onrender.com,https://expense-tracker-saipranav.onrender.com,http://localhost:3000"
      - key: JAVA_OPTS
        value: "-Xmx400m -Xms200m -XX:+UseG1GC"
